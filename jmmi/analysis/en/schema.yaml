
_imports:
  - "../../../common/schema_defaults.yaml"

programme_type: "jmmi"
output_type: "analysis"

loaded_sheets:
    
  - $use: survey
  - $use: choices
  - $use: clean_data
    $append_columns:
      - standard_name: "country"
        allow_fuzzy_matching: false
        allow_empty_values: false
      - standard_name: "round"
        allow_fuzzy_matching: false
      - $use: temporal_columns
      - $use: admin_columns

unloaded_sheets:
  - $use: read_me
  - $use: sampling_info  
  - $use: composite_indicators
  - $use: checklist_data_analysis
